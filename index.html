<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Cardio Pente</title>
    <meta name="description" content="Calculateur d'équivalence Pas/Pente pour entraînement cardio.">
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc; --text: #e0e0e0; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: var(--surface); padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(187, 134, 252, 0.2); width: 90%; max-width: 400px; }
        h2 { color: var(--primary); text-align: center; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: var(--primary); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .result { margin-top: 20px; padding: 15px; background: #252525; border-left: 4px solid var(--primary); display: none; }
        .highlight { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
<div class="container">
    <h2>Cardio Pente Calc</h2>
    <label>Vitesse (km/h)</label><input type="number" id="speed" value="4" step="0.1">
    <label>Pente (%)</label><input type="number" id="slope" value="5" step="0.5">
    <label>Durée (min)</label><input type="number" id="time" value="30">
    <button onclick="calc()">Calculer</button>
    <div id="res" class="result">
        <p>Pas physiques : <span id="pSteps">0</span></p>
        <hr style="border-color:#444"><p>🔥 Équivalent Effort : <br><span id="eSteps" class="highlight">0</span></p>
    </div>
</div>
<script>
    function calc() {
        const s = parseFloat(document.getElementById('speed').value);
        const p = parseFloat(document.getElementById('slope').value);
        const t = parseFloat(document.getElementById('time').value);
        if(isNaN(s)||isNaN(p)||isNaN(t)) return alert("Valeurs invalides");
        
        const distM = (s * (t/60)) * 1000;
        const phys = Math.floor(distM / 0.75); // Foulée moyenne
        const eff = Math.floor(phys * (1 + (p/10))); // Règle du +10% par 1% de pente

        document.getElementById('pSteps').innerText = phys;
        document.getElementById('eSteps').innerText = eff;
        document.getElementById('res').style.display = 'block';
    }
</script>
</body>
</html>
